name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (VPS)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Build frontend (avec les secrets GitHub) ────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}

      # ── Copier le dist/ sur le VPS ──────────────────────────────────────────
      - name: Sync frontend dist to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.FOLDER }}/dist/
          remote_host: ${{ secrets.IP_SERVER }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.PRIVATE_KEY }}

      # ── Backend : git pull + build + PM2 restart ────────────────────────────
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.FOLDER }}

            git pull origin main

            cd backend
            npm ci --omit=dev
            npm run build

            pm2 restart ladelicieuse-api || pm2 start dist/index.js --name ladelicieuse-api
            pm2 save

            echo "Deployment complete"
