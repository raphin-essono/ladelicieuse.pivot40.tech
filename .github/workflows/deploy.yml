name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires CI to pass before deploying
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: []   # Add: [frontend, backend] from ci.yml once workflows are in separate files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Build frontend ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Add other VITE_* secrets here

      # ── Build backend ───────────────────────────────────────────────────────
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      # ── Deploy ──────────────────────────────────────────────────────────────
      # Uncomment and adapt one of the sections below for your hosting provider.

      # --- Option A: Render (via Deploy Hook) ---
      # - name: Trigger Render deploy
      #   run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # --- Option B: Railway ---
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: ${{ secrets.RAILWAY_SERVICE_ID }}

      # --- Option C: VPS via SSH + rsync ---
      # - name: Deploy to VPS
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.VPS_HOST }}
      #     username: ${{ secrets.VPS_USER }}
      #     key: ${{ secrets.VPS_SSH_KEY }}
      #     script: |
      #       cd /var/www/ladelicieuse
      #       git pull origin main
      #       cd backend && npm ci --omit=dev && npm run build && pm2 restart ladelicieuse-api
      #       cd .. && npm ci --omit=dev && npm run build

      # --- Option D: Docker + GHCR ---
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}:latest

      - name: Deployment complete
        run: echo "Deploy step — configure your hosting provider above."
